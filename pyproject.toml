[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermesmesh"
version = "0.1.0"
description = "AI-Native Distributed Intelligent Quantitative Analysis Platform"
readme = "README.md"
authors = ["HermesMesh Team <hermesmesh@example.com>"]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = ["ai", "hermes", "quantitative", "finance", "distributed", "mesh"]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "kafka-python>=2.0.2",
    "nats-py>=2.0.0",
    "redis>=5.0.1",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.23",
    "pandas>=2.2.2",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.2",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.scripts]
hermesmesh = "hermesmesh.cli:main"

[tool.ruff]
line-length = 88
target-version = "py310"
